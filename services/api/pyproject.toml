[project]
name = "msku-api"
version = "0.6.1"
description = "FastAPI service for MSKU Racing Dynamics Studio"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "msku-engineering",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "scipy-stubs>=1.14,<2",
]

[tool.uv.sources]
msku-engineering = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msku_api"]

