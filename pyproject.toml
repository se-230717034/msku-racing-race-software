[tool.uv.workspace]
members = ["packages/engineering", "services/api", "services/ansys_bridge"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["packages/engineering/tests", "services/api/tests", "services/ansys_bridge/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

